name: Publicar no Firebase
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: { group: deploy, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Instalar e montar o site
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Instalar dependências das funções
        run: npm install --prefix functions --no-audit --no-fund --omit=dev
      - name: Credenciais
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
      - name: Publicar
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          set -o pipefail
          npx --yes firebase-tools@14 deploy --project "${{ secrets.FIREBASE_PROJECT_ID }}" --non-interactive --force 2>&1 | tee deploy.log || {
            grep -iE "error|denied|enable|failed|permission|billing|not found" deploy.log | tail -25 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
