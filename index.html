<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080B">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<title>Atlas · Imagine Concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700;800&family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Montserrat:wght@400;600;800&family=DM+Serif+Display&family=Bebas+Neue&family=Inter:wght@400;600;800&family=Poppins:wght@400;600;700;800&family=Raleway:wght@400;700&family=Space+Grotesk:wght@500;700&family=Oswald:wght@400;600&family=Lora:ital,wght@0,400;0,600;1,400&family=Libre+Baskerville:wght@400;700&family=Roboto+Slab:wght@400;700&family=Caveat:wght@600&display=swap">


<style>:root{color-scheme:dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<div id="login" class="login">
  <div class="login-card">
    <div class="login-brand" id="loginBrand"></div>
    <form id="loginForm" class="login-form" autocomplete="on" data-mode="login" novalidate>
      <h1 id="lgTitle">Acesso interno</h1>
      <p class="muted" id="lgSub">Entre com seu e-mail e senha de sócio.</p>
      <label class="fld" id="lgNameF" hidden><span>Seu nome</span><input id="lgName" name="name" type="text" autocomplete="name"></label>
      <label class="fld"><span>E-mail</span><input id="lgUser" name="email" type="email" autocomplete="username" inputmode="email"></label>
      <label class="fld" id="lgPassF"><span>Senha</span><input id="lgPass" name="pass" type="password" autocomplete="current-password"></label>
      <button class="btn btn-primary btn-lg" type="submit" id="lgGo">Entrar</button>
      <p class="lg-msg" id="lgMsg" role="status" aria-live="polite"></p>
      <div class="lg-links" id="lgLinks"></div>
      <p class="hint" id="lgHint"></p>
    </form>
  </div>
</div>

<div id="app" class="app" hidden>
  <header class="topbar">
    <div class="tb-in">
      <a class="brand" href="#inicio" id="brand" aria-label="Atlas, início"></a>
      <div class="search">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="gsearch" type="search" placeholder="Pesquisar leads, clientes, projetos…" autocomplete="off" aria-label="Pesquisar">
        <div id="gresults" class="gresults" hidden></div>
      </div>
      <div class="tb-actions">
        <button class="ibtn" data-act="quickNew" aria-label="Criar novo"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="ibtn" data-act="openAlerts" aria-label="Alertas"><svg class="ic" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><span class="dot" id="alertDot"></span></button>
        <button class="avatar-btn" data-act="userMenu" aria-label="Menu do usuário"><span class="av av-lg" id="meAv">VC</span></button>
      </div>
    </div>
  </header>
  <nav class="tabs" id="tabs" aria-label="Módulos"></nav>
  <main id="main" class="main" tabindex="-1"></main>
  <footer class="util">
    <div class="util-in">
      <button class="ubtn" data-act="openNotes"><svg class="ic" viewBox="0 0 24 24"><path d="M5 4h10l4 4v12H5z"/><path d="M9 12h6M9 16h4"/></svg><span>Notas</span></button>
      <button class="ubtn" data-act="openLinks"><svg class="ic" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg><span>Links úteis</span></button>
      <button class="ubtn" data-act="toggleHP"><svg class="ic" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 11h2M12 11h2M16 11h0M8 15h2M12 15h2M8 18h2M12 18h2M16 15v3"/></svg><span>Calculadora HP12C</span></button>
      <button class="ubtn" data-act="openWhats"><svg class="ic" viewBox="0 0 24 24"><path d="M4 20l1.5-4A8 8 0 1 1 8 18.5z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1-1.5-2-1-1 .8a4 4 0 0 1-2-2l.8-1-1-2z"/></svg><span>WhatsApp</span><em class="soon">em breve</em></button>
      <span class="util-sp"></span>
      <span class="util-sync" id="syncInfo"><span class="live-dot"></span>Salvo neste navegador</span>
    </div>
  </footer>
</div>

<div id="studio" class="studio" hidden></div>
<div id="scrim" class="scrim" hidden></div>
<aside id="drawer" class="drawer" hidden aria-label="Detalhes"></aside>
<div id="pop" class="pop" hidden></div>
<div id="modal" class="modal-wrap" hidden></div>
<section id="hp" class="hp" hidden aria-label="Calculadora financeira HP12C"></section>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script type="module" src="/src/main.js"></script>
</body>
</html>
